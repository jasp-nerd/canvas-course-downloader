<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Course Downloader</title>
  <style>
    :root {
      --brand: #e82429;
      --brand-hover: #c51f23;
      --brand-tint: #fef2f2;
      --text: #1f2937;
      --text-muted: #6b7280;
      --text-faint: #9ca3af;
      --border: #e5e7eb;
      --surface: #ffffff;
      --hover: #f9fafb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--surface);
      color: var(--text);
      letter-spacing: -0.005em;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 7px;
      flex-shrink: 0;
      display: block;
    }
    .header h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .icon-btn {
      margin-left: auto;
      width: 30px; height: 30px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-faint);
      transition: background 0.12s, color 0.12s, transform 0.08s;
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); }
    .icon-btn:active { transform: scale(0.96); }
    .icon-btn svg { width: 16px; height: 16px; }

    /* Status pill */
    #status {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--hover);
      border-radius: 8px;
    }
    #status::before {
      content: "";
      width: 6px; height: 6px; border-radius: 999px;
      background: var(--text-faint);
      flex-shrink: 0;
    }
    #status.state-success { color: #15803d; background: #f0fdf4; }
    #status.state-success::before { background: #22c55e; }
    #status.state-error { color: #b91c1c; background: var(--brand-tint); }
    #status.state-error::before { background: #dc2626; }

    /* Info card */
    .info-section {
      background: var(--hover);
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      display: none;
    }
    .info-section .info-label {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .info-section .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .info-section .info-value {
      color: var(--text);
      font-weight: 500;
      font-size: 13px;
    }

    /* Content tags */
    .content-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px;
    }
    .content-tag {
      background: #f3f4f6;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 10.5px;
      color: var(--text-faint);
      font-weight: 500;
      border: 1px solid transparent;
    }
    .content-tag.active {
      background: var(--brand-tint);
      color: #b91c1c;
      border-color: #fecaca;
    }

    /* Queue */
    .queue-section {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 12px;
      display: none;
    }
    .queue-section .queue-label {
      font-weight: 600;
      color: #92400e;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .queue-bar-bg {
      background: rgba(146, 64, 14, 0.15);
      border-radius: 999px;
      height: 5px;
      overflow: hidden;
      margin-top: 6px;
    }
    .queue-bar {
      background: var(--brand);
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s;
    }
    .queue-stats {
      margin-top: 6px;
      font-size: 11px;
      color: #92400e;
    }

    /* Primary Button & Secondary Button */
    button#downloadBtn, 
    button#viewBtn {
      width: 100%;
      padding: 10px 14px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      margin-top: 14px;
      font-size: 13.5px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: -0.005em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
      transition: background 0.12s, transform 0.08s, box-shadow 0.12s;
    }
    button#downloadBtn:hover {
      background: var(--brand-hover);
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    button#downloadBtn:active { transform: scale(0.98); }
    button#downloadBtn:disabled {
      background: var(--border);
      color: var(--text-faint);
      cursor: not-allowed;
      box-shadow: none;
    }
    button#downloadBtn svg { 
      width: 14px; 
      height: 14px; 
    }
    /*
    Used to provide different styling depending on context
    View button background is white while on a canvas page, but 
    turns red to draw attention when the download button is disabled
    */
    button#viewBtn:not(:hover):not(:disabled):not(.view-btn-red) { 
      background: #fff;
      border: 1px solid var(--brand);
      color: var(--brand);
    }
    button#viewBtn:hover:not(:disabled) {
      background: var(--brand-hover);
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      border: 1px solid var(--brand-hover);
    }
    button#viewBtn:active { transform: scale(0.98); }
    button#viewBtn:disabled {
      background: var(--border);
      color: var(--text-faint);
      cursor: not-allowed;
      box-shadow: none;
    }
    button#viewBtn svg { 
      width: 16px; 
      height: 16px; 
      fill: #fff 
    }
    button#viewBtn:disabled svg { 
      fill: var(--text-faint)
    }
    button#viewBtn:not(:hover):not(:disabled):not(.view-btn-red) svg { 
      fill: var(--brand) 
    }
    /* Feedback prompt */
    .feedback-card {
      margin-top: 12px;
      padding: 12px;
      background: var(--hover);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 12.5px;
      display: none;
      position: relative;
    }
    .feedback-card .feedback-dismiss {
      position: absolute;
      top: 6px;
      right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-faint);
      font-size: 14px;
      line-height: 1;
      padding: 2px 4px;
      font-family: inherit;
    }
    .feedback-card .feedback-dismiss:hover { color: var(--text); }
    .feedback-card .feedback-prompt {
      color: var(--text);
      font-weight: 500;
      margin-bottom: 8px;
      padding-right: 16px;
    }
    .feedback-card .feedback-actions {
      display: flex;
      gap: 6px;
    }
    .feedback-btn {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      transition: background 0.12s, border-color 0.12s, transform 0.08s;
    }
    .feedback-btn:hover {
      background: var(--hover);
      border-color: var(--border-strong, #d1d5db);
    }
    .feedback-btn:active { transform: scale(0.98); }
    .feedback-followup {
      color: var(--text-muted);
      line-height: 1.5;
      display: none;
    }
    .feedback-followup a {
      color: var(--brand);
      font-weight: 600;
      text-decoration: none;
    }
    .feedback-followup a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <img class="brand-mark" src="icons/icon-128.png" alt="">
    <h2>Course Downloader</h2>
    <button class="icon-btn" id="settingsLink" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div id="status">Checking page...</div>

  <div class="info-section" id="courseInfo">
    <div class="info-row">
      <span id="courseName"></span>
    </div>
    <div id="contentTypesRow">
      <div class="info-label" style="margin-top:10px;">Exporting</div>
      <div class="content-tags" id="contentTags"></div>
    </div>
  </div>

  <div class="queue-section" id="queueSection">
    <div class="queue-label">Downloads in progress</div>
    <div id="queueText"></div>
    <div class="queue-bar-bg"><div class="queue-bar" id="queueBar" style="width:0%"></div></div>
    <div class="queue-stats" id="queueStats"></div>
  </div>

  <button id="downloadBtn" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 4v12"/><path d="M6 12l6 6 6-6"/><path d="M5 20h14"/>
    </svg>
    <span id="downloadBtnLabel">Download Course Content</span>
  </button>

  <button id="viewBtn">
    <svg viewBox="0 0 1920 1920" xmlns="http://www.w3.org/2000/svg">
      <path d="M960 1489.82c-348.474 0-668.545-202.323-841.298-529.918C291.455 632.306 611.526 429.984 960 429.984s668.545 202.322 841.298 529.918C1628.545 1287.497 1308.474 1489.82 960 1489.82Zm948.342-553.552C1720.645 558.648 1357.332 324 960 324c-397.333 0-760.645 234.648-948.342 612.268L0 959.902l11.658 23.634c187.697 377.62 551.01 612.268 948.342 612.268 397.333 0 760.645-234.648 948.342-612.268L1920 959.902l-11.658-23.634ZM960 1171.869c-116.9 0-211.967-95.067-211.967-211.967 0-116.9 95.067-211.967 211.967-211.967 116.9 0 211.967 95.067 211.967 211.967 0 116.9-95.067 211.967-211.967 211.967m0-529.918c-175.297 0-317.951 142.654-317.951 317.951 0 175.297 142.654 317.95 317.951 317.95 175.297 0 317.951-142.653 317.951-317.95S1135.297 641.951 960 641.951" fill-rule="evenodd"/>
    </svg>
    <span id="viewBtnLabel">View Downloaded Course</span>
  </button>

  <div class="feedback-card" id="feedbackCard">
    <button class="feedback-dismiss" id="feedbackDismiss" aria-label="Dismiss">×</button>
    <div class="feedback-ask" id="feedbackAsk">
      <div class="feedback-prompt">Enjoying Course Downloader?</div>
      <div class="feedback-actions">
        <button class="feedback-btn" id="feedbackYes">👍 Yes</button>
        <button class="feedback-btn" id="feedbackNo">👎 Not really</button>
      </div>
    </div>
    <div class="feedback-followup" id="feedbackPositive">
      Glad to hear it! A quick <a href="https://chromewebstore.google.com/detail/mmnmcnffbkcnhcjiidmdnaclpfeekiol/reviews" target="_blank">review on the Web Store</a> helps other students find it.
    </div>
    <div class="feedback-followup" id="feedbackNegative">
      Sorry about that. <a href="https://github.com/jasp-nerd/canvas-course-downloader/issues/new?labels=bug" target="_blank" rel="noopener">Tell us what went wrong</a> — we read every report.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
