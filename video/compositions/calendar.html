  <script>
    // November 2026 starts on a Sunday. The due dates are the sample course's assignments.
    const EVENTS = { 4: 'Assignment 2', 13: 'Midterm project', 18: 'Assignment 3', 30: 'Final project' };
    const grid = document.querySelector('#c-grid');
    for (const d of ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']) {
      const el = document.createElement('p');
      el.className = 'c-dow';
      el.textContent = d;
      grid.append(el);
    }
    for (let i = 0; i < 35; i++) {
      const day = i + 1;
      const cell = document.createElement('div');
      cell.className = day > 30 ? 'c-day out' : 'c-day';
      cell.textContent = String(day > 30 ? day - 30 : day);
      if (EVENTS[day]) {
        const ev = document.createElement('p');
        ev.className = 'c-ev';
        ev.textContent = EVENTS[day];
        cell.append(ev);
      }
      grid.append(cell);
    }

    const tl = gsap.timeline({ paused: true });
    window.enterTitle(tl, '#c-t', 0.15);
    tl.fromTo('#c-file', { x: -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 0.35);
    // A copy of the file drops into the calendar, and the due dates appear.
    tl.fromTo('#c-ghost', { x: 0, y: 0, scale: 1, opacity: 1 }, { immediateRender: false, x: 820, y: -40, scale: 0.6, opacity: 0, duration: 0.6, ease: 'power3.in' }, 0.95);

    window.__timelines['calendar'] = tl;
