  <script>
    const $ = (s) => document.querySelector(s);
    const ring = $('#h-ring-r');
    const fav = $('#h-fav');
    for (const svg of [ring, $('#h-ring-w'), fav, $('#h-logo')]) window.drawLogo(svg);
    window.fillLogo($('#h-logo'), 1);
    window.fillLogo($('#h-ring-w'), 1);

    // Every name once: 54 files, a new row every third file, 18 rows.
    const FILES = [
      'Syllabus.pdf', 'Lecture 01 - Academic Writing week 1.pdf', 'Week 1 - Core reading.pdf',
      'Assignment 1 brief.pdf', 'Lecture 03 - Academic Writing week 3.pdf', 'Course schedule',
      'Week 3 - Background article.pdf', 'Rubric.pdf', 'Lecture 05 - Academic Writing week 5.pdf',
      'Assignment 2', 'Midterm project', 'Lecture 07 - Academic Writing week 7.pdf', 'Practice exam.pdf',
      'Peer review guide.pdf', 'Lecture 09 - Academic Writing week 9.pdf', 'Final project', 'Grades.csv',
      'Deadlines.ics',
    ];
    const total = 54;
    const rows = [...document.querySelectorAll('.h-row')];
    const progress = { p: 0 };
    const paint = () => {
      // Saved only at 100%, so the count never says done while the percentage still reads 99.
      const finished = progress.p >= 1;
      const done = finished ? total : Math.min(total - 1, Math.round(progress.p * total));
      window.fillLogo(ring, progress.p);
      window.fillLogo(fav, progress.p);
      $('#h-pct').textContent = `${finished ? 100 : Math.min(99, Math.round(progress.p * 100))}%`;
      $('#h-pct').style.color = finished ? 'var(--mint-ink)' : 'var(--red)';
      $('#h-fill').style.background = finished ? 'var(--mint)' : 'var(--red)';
      $('#h-name').textContent = finished ? 'Academic Writing is saved' : 'Saving Academic Writing';
      $('#h-tab-title').textContent = finished ? 'Academic Writing is saved' : 'Saving Academic Writing';
      $('#h-count').textContent = finished ? '53 of 54 files, 1 missing' : `${done} of ${total} files`;
      $('#h-count').style.color = finished ? 'var(--sun-ink)' : 'var(--ink-2)';
      const shown = Math.floor(done / 3);
      rows.forEach((row, i) => {
        const name = FILES[shown - 1 - i];
        row.style.visibility = name ? 'visible' : 'hidden';
        row.querySelector('span').textContent = name ?? '';
      });
    };

    const tl = gsap.timeline({ paused: true });
    // 0–2: close on the button, the cursor arrives, a click at 1.5 while the camera pulls back.
    tl.fromTo('#h-cam', { scale: 1.25 }, { scale: 1.27, duration: 1.3, ease: 'sine.inOut' }, 0);
    tl.fromTo('#h-cam', { scale: 1.27 }, { immediateRender: false, scale: 1, duration: 0.8, ease: 'power3.inOut' }, 1.3);
    tl.fromTo('#h-cursor', { x: 1500, y: 860 }, { x: 579, y: 154, duration: 1.15, ease: 'power3.out' }, 0.25);
    window.press(tl, '#h-cursor', 1.44);
    tl.fromTo('#h-press', { opacity: 0 }, { opacity: 0.2, duration: 0.06 }, 1.44);
    tl.fromTo('#h-press', { opacity: 0.2 }, { immediateRender: false, opacity: 0, duration: 0.2 }, 1.56);
    tl.fromTo('#h-cursor', { opacity: 1 }, { immediateRender: false, opacity: 0, duration: 0.2 }, 1.85);
    // The new tab opens beside the course and takes over.
    tl.fromTo('#h-tab-b', { width: 0, padding: '0px 0px' }, { width: 360, padding: '0px 18px', duration: 0.35, ease: 'power3.out' }, 1.6);
    tl.fromTo('#h-tab-a', { backgroundColor: '#ffffff' }, { backgroundColor: 'rgba(255,255,255,0)', duration: 0.12 }, 1.95);
    tl.fromTo('#h-tab-b', { backgroundColor: 'rgba(255,255,255,0)' }, { backgroundColor: '#ffffff', duration: 0.12 }, 1.95);
    tl.fromTo('#h-url-a', { opacity: 1 }, { opacity: 0, duration: 0.12 }, 1.95);
    tl.fromTo('#h-url-b', { opacity: 0 }, { opacity: 1, duration: 0.12 }, 1.95);
    tl.fromTo('#h-export', { opacity: 0 }, { opacity: 1, duration: 0.18 }, 1.95);
    // The button's ring grows into the progress ring, turning from white to the brand's red.
    tl.fromTo('#h-ring', { x: 214, y: -273, scale: 25 / 180 }, { x: 0, y: 0, scale: 1, duration: 0.6, ease: 'power4.out' }, 1.95);
    tl.fromTo('#h-ring-w', { opacity: 1 }, { opacity: 0, duration: 0.35, ease: 'power1.in' }, 2.05);
    tl.fromTo('#h-card', { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'power3.out', transformOrigin: '138px 134px' }, 2.3);
    // 2.5–5.0: the course saves; 100% lands on the downbeat at 5.0.
    tl.fromTo(progress, { p: 0 }, { p: 1, duration: 2.5, ease: 'power1.inOut', onUpdate: paint }, 2.5);
    tl.fromTo('#h-fill', { scaleX: 0 }, { scaleX: 1, duration: 2.5, ease: 'power1.inOut' }, 2.5);
    window.enterTitle(tl, '#h-t1', 2.9);
    window.pushIn(tl, '#h-hold', 2.6, 3.3);
    window.exitTitle(tl, '#h-t1', 5.7);
    // 5.9–6.6: the card becomes the receipt; the yellow band drops in above it.
    tl.fromTo('#h-prog', { opacity: 1 }, { immediateRender: false, opacity: 0, duration: 0.18 }, 5.9);
    tl.fromTo('#h-ring', { opacity: 1 }, { immediateRender: false, opacity: 0, duration: 0.18 }, 5.9);
    tl.fromTo('#h-card', { y: 0, width: 760, height: 484, borderRadius: 40 }, { immediateRender: false, y: 166, width: 960, height: 720, borderRadius: 32, duration: 0.6, ease: 'power3.inOut' }, 5.95);
    tl.fromTo('#h-band', { opacity: 0, y: -28 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 6.1);
    tl.fromTo('#h-rcpt', { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.35);
    window.enterTitle(tl, '#h-t2', 6.75);
    // The camera eases in on the file that failed and holds while it's read.
    tl.fromTo('#h-push', { scale: 1 }, { scale: 1.1, duration: 1.8, ease: 'sine.inOut' }, 7.1);
    paint();
    window.__timelines['hook'] = tl;
  </script>
