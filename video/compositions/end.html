  <div id="root" data-composition-id="end" data-width="1920" data-height="1080">
    <div id="e-dark"></div>
    <div id="e-cam" data-layout-allow-overflow>
      <div id="e-lockup">
        <svg id="e-ring" class="ring"></svg>
        <p id="e-word"><span id="e-name">Course Downloader</span><span id="e-ver">3.0</span><img id="e-pip" src="assets/pip/cheer.webp" alt="" /></p>

  <script>
    const ring = document.querySelector('#e-ring');
    window.drawLogo(ring);
    const progress = { p: 0 };
    const paint = () => window.fillLogo(ring, progress.p);
    // Before the name arrives, the mark sits large in the middle of the frame. The lockup is
    // 150 + 40 + 774 (the name) + 20 + 91 (the badge) = 1075 px wide, so the mark's centre is at
    // (497.5, 455); measured once with the fonts loaded, as layout may run before they are.
    const dx = 960 - 497.5;
    const dy = 540 - 455;

    const tl = gsap.timeline({ paused: true });
    // 0–1.5: the ring fills on the light ground, the drums out.
    tl.fromTo('#e-ring', { x: dx, y: dy, scale: 2.4 }, { x: dx, y: dy, scale: 2.5, duration: 1.5, ease: 'sine.inOut' }, 0);
    tl.fromTo(progress, { p: 0 }, { p: 1, duration: 1.3, ease: 'power2.inOut', onUpdate: paint }, 0.05);
    // 1.5: the ground goes dark and the mark moves into the lockup as the name wipes in.
    tl.fromTo('#e-dark', { clipPath: 'circle(0px at 960px 540px)' }, { clipPath: 'circle(1200px at 960px 540px)', duration: 0.35, ease: 'power2.inOut' }, 1.5);
    tl.fromTo('#e-ring', { x: dx, y: dy, scale: 2.5 }, { immediateRender: false, x: 0, y: 0, scale: 1, duration: 0.5, ease: 'power3.inOut' }, 1.5);
    tl.fromTo('#e-name', { clipPath: 'inset(0 100% 0 0)', x: -24 }, { clipPath: 'inset(0 0% 0 0)', x: 0, duration: 0.55, ease: 'expo.out' }, 2.0);
    tl.fromTo('#e-ver', { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(2)' }, 2.25);
    // Pip pops up onto the name on the beat at 2.0 (36.0 in the release film).
    tl.fromTo('#e-pip', { y: 90, opacity: 0, scaleY: 0.9 }, { y: 0, opacity: 1, scaleY: 1, duration: 0.4, ease: 'back.out(1.6)', transformOrigin: '50% 100%' }, 2.0);
    tl.fromTo('#e-cta', { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 2.45);
    window.pushIn(tl, '#e-cam', 2.0, 4.0, 1.025);
    paint();
    window.__timelines['end'] = tl;
  </script>
