  <script>
    const $ = (s) => document.querySelector(s);
    const ring = $('#d-ring');
    const fav = $('#d-fav');
    for (const svg of [ring, fav, $('#d-note-logo')]) window.drawLogo(svg);
    window.fillLogo($('#d-note-logo'), 1);
    const progress = { p: 0 };
    const paint = () => {
      const done = progress.p >= 1;
      window.fillLogo(ring, progress.p);
      window.fillLogo(fav, progress.p);
      $('#d-pct').textContent = `${done ? 100 : Math.min(99, Math.round(progress.p * 100))}%`;
      $('#d-pct').style.color = done ? 'var(--mint-ink)' : 'var(--red)';
      $('#d-name').textContent = done ? 'Academic Writing is saved' : 'Saving Academic Writing';
      $('#d-tab-title').textContent = done ? 'Academic Writing is saved' : 'Saving Academic Writing';
      $('#d-count').textContent = done ? '1 new file. The 53 you already had were skipped.' : '0 of 1 new file';
    };

    const tl = gsap.timeline({ paused: true });
    // The note arrives at the top of the dashboard and pushes the courses down.
    window.enterTitle(tl, '#d-t', 0.15);
    tl.fromTo('#d-cards', { y: -116 }, { y: 0, duration: 0.55, ease: 'power3.inOut' }, 0.6);
    tl.fromTo('#d-note', { opacity: 0, scaleY: 0.6 }, { opacity: 1, scaleY: 1, duration: 0.4, ease: 'power3.out' }, 0.9);
    window.pushIn(tl, '#d-win', 0, 6, 1.025);
    // The cursor presses Download 1 new file.
    tl.fromTo('#d-cursor', { x: 1900, y: 860 }, { x: 1673, y: 323, duration: 1.2, ease: 'power3.out' }, 1.6);
    window.press(tl, '#d-cursor', 2.94);
    tl.fromTo('#d-press', { opacity: 0 }, { opacity: 0.2, duration: 0.06 }, 2.94);
    tl.fromTo('#d-press', { opacity: 0.2 }, { immediateRender: false, opacity: 0, duration: 0.2 }, 3.06);
    tl.fromTo('#d-cursor', { opacity: 1 }, { immediateRender: false, opacity: 0, duration: 0.2 }, 3.25);
    // Its own tab opens and saves just that file.
    tl.fromTo('#d-tab-b', { width: 0, padding: '0px 0px' }, { width: 360, padding: '0px 18px', duration: 0.35, ease: 'power3.out' }, 3.1);
    tl.fromTo('#d-tab-a', { backgroundColor: '#ffffff' }, { backgroundColor: 'rgba(255,255,255,0)', duration: 0.12 }, 3.45);
    tl.fromTo('#d-tab-b', { backgroundColor: 'rgba(255,255,255,0)' }, { backgroundColor: '#ffffff', duration: 0.12 }, 3.45);
    tl.fromTo('#d-url-a', { opacity: 1 }, { opacity: 0, duration: 0.12 }, 3.45);
    tl.fromTo('#d-url-b', { opacity: 0 }, { opacity: 1, duration: 0.12 }, 3.45);
    tl.fromTo('#d-export', { opacity: 0 }, { opacity: 1, duration: 0.18 }, 3.45);
    tl.fromTo('#d-card', { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 3.5);
    tl.fromTo(progress, { p: 0 }, { p: 1, duration: 0.9, ease: 'power2.inOut', onUpdate: paint }, 3.75);
    paint();
    window.__timelines['dashboard'] = tl;
