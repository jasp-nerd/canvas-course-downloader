  <div id="root" data-composition-id="s2" data-width="1920" data-height="1080">

      <div class="s2-top">

        </div>
      </div>
      <div class="s2-bar"><div id="s2-fill"></div></div>
      <div class="s2-row"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg><span id="s2-r1">Syllabus.pdf</span></div>
      <div class="s2-row"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg><span id="s2-r2">Lecture 01 - Academic Writing week 1.pdf</span></div>
      <div class="s2-row"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg><span id="s2-r3">Lecture 02 - Academic Writing week 2.pdf</span></div>

      <p id="s2-t1" class="title"><span class="w">Exports</span> <span class="w">run</span> <span class="w">in</span> <span class="w">their</span> <span class="w">own</span> <span class="w">tab.</span></p>
      <p id="s2-t2" class="title"><span class="w">Keep</span> <span class="w">using</span> <span class="w">Canvas,</span> <span class="w">or</span> <span class="w">close</span> <span class="w">it.</span></p>

  <script>
    const ring = document.querySelector('#s2-ring');
    window.drawLogo(ring);
    const FILES = [
      'Syllabus.pdf', 'Lecture 01 - Academic Writing week 1.pdf', 'Lecture 02 - Academic Writing week 2.pdf',
      'Week 1 - Core reading.pdf', 'Lecture 03 - Academic Writing week 3.pdf', 'Assignment 1 brief.pdf',
      'Lecture 04 - Academic Writing week 4.pdf', 'Week 4 - Background article.pdf', 'Rubric.pdf',
      'Lecture 05 - Academic Writing week 5.pdf', 'Course schedule', 'Assignment 2', 'Practice exam.pdf',
      'Formula sheet.pdf', 'Midterm project', 'Grades.csv', 'Deadlines.ics', 'Exam information',
    ];
    const total = 54;
    const progress = { p: 0 };
    const paint = () => {
      const p = progress.p;
      const done = Math.round(p * total);
      window.fillLogo(ring, p);
      const finished = done >= total;
      document.querySelector('#s2-pct').textContent = `${Math.round(p * 100)}%`;
      document.querySelector('#s2-pct').style.color = finished ? 'var(--mint-ink)' : 'var(--red)';
      document.querySelector('#s2-fill').style.background = finished ? 'var(--mint)' : 'var(--red)';
      document.querySelector('#s2-name').textContent = finished ? 'Academic Writing is saved' : 'Saving Academic Writing';
      document.querySelector('#s2-count').textContent = finished ? '53 of 54 files, 1 missing' : `${done} of ${total} files`;
      const newest = Math.max(0, Math.floor(done / 3));
      ['#s2-r1', '#s2-r2', '#s2-r3'].forEach((id, i) => {
        document.querySelector(id).textContent = finished
          ? ['Files 23 of 24', 'Pages and assignments 9', 'Quizzes and discussions 5'][i]
          : FILES[(newest + 2 - i + FILES.length) % FILES.length];
      });
    };
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('#s2-iris', { clipPath: 'circle(0px at 713px 153px)' }, { clipPath: 'circle(2300px at 713px 153px)', duration: 0.4, ease: 'power3.in' }, 0);
    // Arrives from the click: slightly large, then settles.
    tl.fromTo('#s2-card', { scale: 1.06, opacity: 0, filter: 'blur(10px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.5, ease: 'expo.out' }, 0);
    tl.fromTo(progress, { p: 0 }, { p: 1, duration: 3.9, ease: 'power1.inOut', onUpdate: paint }, 0.5);
    tl.fromTo('#s2-fill', { scaleX: 0 }, { scaleX: 1, duration: 3.9, ease: 'power1.inOut' }, 0.5);
    // Line one, word by word out of a blur; line two replaces it in place.
    tl.fromTo('#s2-t1 .w', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, stagger: 0.067, ease: 'power4.out' }, 0.8);
    tl.fromTo('#s2-t1', { opacity: 1, filter: 'blur(0px)' }, { opacity: 0, filter: 'blur(8px)', duration: 0.18, ease: 'power3.in' }, 3.5);
    tl.fromTo('#s2-t2 .w', { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.13, stagger: 0.067, ease: 'power4.out' }, 3.62);
    paint();
    window.__timelines['s2'] = tl;
  </script>
