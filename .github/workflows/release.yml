# Builds every package for a version tag and drafts a GitHub release. Nothing is published:
# jasp reviews the draft and publishes it, which then starts submit.yml.
name: Release

on:
  push:
    tags: ['v*.*.*']
  # A dry run: build and check everything, draft nothing.
  workflow_dispatch:

permissions:
  contents: read

concurrency: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm format:check
      - run: pnpm verify

      - name: Check the tag, the branch and the notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME doesn't match package.json $version"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Releases come from main"; exit 1; }
          mkdir -p dist
          node scripts/release-notes.ts "$version" > dist/notes.md

      - run: pnpm zip && pnpm zip:firefox && pnpm zip:edge

      - name: Rebuild Firefox from the sources zip, without git, as an AMO reviewer would
        run: |
          src="$RUNNER_TEMP/src"
          mkdir -p "$src" && unzip -q .output/*-sources.zip -d "$src"
          (cd "$src" && pnpm install --frozen-lockfile && pnpm build:firefox)
          diff -r "$src/.output/firefox-mv3" .output/firefox-mv3

      - name: Name the packages the same for every version
        run: |
          mkdir -p dist
          cp .output/*-chrome.zip dist/canvas-course-downloader-chrome.zip
          cp .output/*-edge.zip dist/canvas-course-downloader-edge.zip
          cp .output/*-firefox.zip dist/canvas-course-downloader-firefox.zip
          cp .output/*-sources.zip dist/canvas-course-downloader-sources.zip
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)

      - uses: actions/attest@v4
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/

  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n\nInstall from your browser'"'"'s store to get updates. The zips are for store reviewers and testing.\n' >> dist/notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "${GITHUB_REF_NAME#v}" --notes-file dist/notes.md
