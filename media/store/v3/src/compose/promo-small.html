<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small promo tile</title>
<link rel="stylesheet" href="store.css">
<style>
  body {
    width: 440px;
    height: 280px;
    background: var(--navy);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 18px 0 26px;
  }
  .ring {
    width: 110px;
    height: 110px;
    flex: none;
  }
  h1 {
    margin: 0;
    font: 800 37px/0.98 var(--font-display);
    letter-spacing: -0.03em;
    color: #fff;
  }
  p {
    margin: 12px 0 0;
    font: 700 15px/1.25 var(--font-ui);
    white-space: nowrap;
    color: var(--sun);
  }
</style>
</head>
<body>
  <img class="ring" src="../../../../../media/brand/logo.svg" alt="">
  <div>
    <h1>Canvas Course Downloader</h1>
    <p class="fit">Save your courses before they close</p>
  </div>
</body>
</html>
